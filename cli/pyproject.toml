[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-sandbox-cli"
version = "0.1.0"
description = "CLI for Cloud Sandbox"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
]

[project.scripts]
sandboxctl = "sandboxctl.main:app"

[tool.hatch.build.targets.wheel]
packages = ["sandboxctl"]
