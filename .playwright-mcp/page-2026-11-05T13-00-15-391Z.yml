        - article [ref=e64]:
          - heading "KVM hypervisor boundaries" [level=3] [ref=e69]
          - paragraph [ref=e70]: Runs code in dedicated microVMs with Linux cgroups, chroot jailers, and individual kernels. A container breakout cannot compromise the host.
        - article [ref=e71]:
          - heading "Sub-second cost ceiling" [level=3] [ref=e75]
          - paragraph [ref=e76]: The host proxy meters prompt and completion tokens per millisecond. If spending exceeds your threshold, the microVM is paused immediately.
