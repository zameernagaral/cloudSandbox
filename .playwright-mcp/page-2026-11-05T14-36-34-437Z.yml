        - heading "Technical Architecture & Defense-in-Depth" [level=2] [ref=f2e61]
        - paragraph [ref=f2e62]: Built on verified Linux KVM hypervisor boundaries and bare-metal chroot isolation.
      - generic [ref=f2e63]:
        - article [ref=f2e64]:
          - heading "KVM hypervisor boundaries" [level=3] [ref=f2e69]
          - paragraph [ref=f2e70]: Runs code in dedicated microVMs with Linux cgroups, chroot jailers, and individual kernels. A container breakout cannot compromise the host.
        - article [ref=f2e71]:
          - heading "Sub-second cost ceiling" [level=3] [ref=f2e75]
          - paragraph [ref=f2e76]: The host proxy meters prompt and completion tokens per millisecond. If spending exceeds your threshold, the microVM is paused immediately.
        - article [ref=f2e77]:
          - heading "Outbound domain whitelist" [level=3] [ref=f2e81]
          - paragraph [ref=f2e82]: Network traffic is restricted to approved APIs (such as api.openai.com). API keys are injected at the proxy and never written to the guest disk.
