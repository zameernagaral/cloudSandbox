          - heading "KVM hypervisor boundaries" [level=3] [ref=f1e64]
          - paragraph [ref=f1e65]: Runs code in dedicated microVMs with Linux cgroups, chroot jailers, and individual kernels. A container breakout cannot compromise the host.
